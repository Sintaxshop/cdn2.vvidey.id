<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asupan Terbaru</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }

        .video-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            background-color: #000000;
            position: relative;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        .play-button::after {
            content: '';
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 15px 0 15px 22px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 6px;
        }

        .video-container:hover .play-button {
            transform: translate(-50%, -50%) scale(1.1);
            background-color: rgba(255, 255, 255, 0.4);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: default;
        }

        .overlay-text {
            color: #ffffff;
            font-size: 15px;
            text-align: center;
            margin-bottom: 20px;
            padding: 0 20px;
            line-height: 1.5;
        }

        .reload-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff4d4d;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 77, 77, 0.4);
            transition: background-color 0.2s, transform 0.1s;
        }

        .reload-btn:hover {
            background-color: #ff1a1a;
        }

        .reload-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="video-container" id="fakePlayer">
        <div class="play-button"></div>
        
        <div class="overlay" id="reloadOverlay">
            <p class="overlay-text">Ada masalah teknis. Refresh halaman ini untuk memuat ulang.</p>
            <button class="reload-btn" id="reloadBtn">Refresh</button>
        </div>
    </div>

    <script>
        const SHOPEE_URL = "https://s.shopee.co.id/50ZTxVLCDB";
        const STORAGE_KEY = "shopee_click_count";

        function checkIsReload() {
            const navEntries = performance.getEntriesByType("navigation");
            if (navEntries.length > 0 && navEntries[0].type === "reload") {
                return true;
            } else if (performance.navigation && performance.navigation.type === 1) {
                return true;
            }
            return false;
        }

        function checkAndShowOverlay() {
            let currentClicks = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);
            if (currentClicks >= 2) {
                document.getElementById("reloadOverlay").style.display = "flex";
            }
        }

        if (checkIsReload()) {
            localStorage.removeItem(STORAGE_KEY);
        } else {
            checkAndShowOverlay();
        }

        window.addEventListener("pageshow", function(event) {
            if (event.persisted && !checkIsReload()) {
                checkAndShowOverlay();
            }
        });

        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === 'visible' && !checkIsReload()) {
                checkAndShowOverlay();
            }
        });

        document.getElementById("fakePlayer").addEventListener("click", function() {
            let currentClicks = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);

            if (currentClicks < 2) {
                currentClicks++;
                localStorage.setItem(STORAGE_KEY, currentClicks);
                window.location.href = SHOPEE_URL;
            } else {
                checkAndShowOverlay();
            }
        });

        document.getElementById("reloadOverlay").addEventListener("click", function(e) {
            e.stopPropagation(); 
        });

        document.getElementById("reloadBtn").addEventListener("click", function(e) {
            e.stopPropagation();
            window.location.reload(true);
        });
    </script>
</body>
</html>
