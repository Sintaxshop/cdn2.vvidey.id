<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asupan Terbaru</title>
    <style>

        #chromeBanner {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 99999;
    background: rgba(0, 0, 0, 0.94);
    color: #fff;
    font-family: sans-serif;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  #chromeBanner .box {
    max-width: 360px;
    width: 100%;
    background: #262626;
    border-radius: 12px;
    padding: 22px 20px;
  }
  #chromeBanner h2 { font-size: 19px; margin-bottom: 8px; text-align: center; }
  #chromeBanner .sub { font-size: 14px; color: #ccc; text-align: center; margin-bottom: 16px; line-height: 1.5; }
  #chromeBanner ol { padding-left: 22px; font-size: 15px; line-height: 1.6; }
  #chromeBanner li { margin-bottom: 8px; }
  #chromeBanner b { color: #8ab4f8; }
  #chromeBanner .note { font-size: 13px; color: #aaa; margin-top: 14px; text-align: center; line-height: 1.5; }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: sans-serif;
        }

        .video-container {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 9 / 16;
            background-color: #000000;
            position: relative;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            overflow: hidden;
        }

        .play-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 70px;
            height: 70px;
            background-color: rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.2s;
        }

        .play-button::after {
            content: '';
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 15px 0 15px 22px;
            border-color: transparent transparent transparent #ffffff;
            margin-left: 6px;
        }

        .video-container:hover .play-button {
            transform: translate(-50%, -50%) scale(1.1);
            background-color: rgba(255, 255, 255, 0.4);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            cursor: default;
        }

        .overlay-text {
            color: #ffffff;
            font-size: 15px;
            text-align: center;
            margin-bottom: 20px;
            padding: 0 20px;
            line-height: 1.5;
        }

        .reload-btn {
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            color: #ffffff;
            background-color: #ff4d4d;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 77, 77, 0.4);
            transition: background-color 0.2s, transform 0.1s;
        }

        .reload-btn:hover {
            background-color: #ff1a1a;
        }

        .reload-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div id="chromeBanner">
  <div class="box">
    <h2>Buka di Chrome dulu ya</h2>
    <div class="sub">Halaman ini tidak berjalan normal di browser bawaan aplikasi.</div>
    <ol id="chromeSteps"></ol>
    <div class="note" id="chromeNote"></div>
  </div>
</div>

    <div class="video-container" id="fakePlayer">
        <div class="play-button"></div>
        
        <div class="overlay" id="reloadOverlay">
            <p class="overlay-text">Ada masalah teknis. Refresh halaman ini untuk memuat ulang.</p>
            <button class="reload-btn" id="reloadBtn">Refresh</button>
        </div>
    </div>

    <script>

        (function () {
  var ua = navigator.userAgent || "";
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);

  // Sudah di Chrome asli?
  var otherBrowser = /Edg\/|EdgA\/|OPR\/|OPiOS|SamsungBrowser|UCBrowser|Brave|Vivaldi|DuckDuckGo|FxiOS/i.test(ua);
  var hasChromeToken = /Chrome\/|CriOS\//i.test(ua);

  // Di browser bawaan aplikasi (X/Twitter dan lainnya)?
  var inAppName = /Twitter|FBAN|FBAV|FB_IAB|Instagram|TikTok|musical_ly|BytedanceWebview|\bLine\/|LinkedInApp|Snapchat|Pinterest|MicroMessenger|Telegram/i.test(ua);
  var androidWebView = isAndroid && /; wv\)/.test(ua);
  var iosWebView = isIOS && /AppleWebKit/i.test(ua) && !/Safari/i.test(ua) && !/CriOS|FxiOS|EdgiOS/i.test(ua);

  var inApp = inAppName || androidWebView || iosWebView;
  var sudahDiChrome = hasChromeToken && !otherBrowser && !inApp;

  // Banner hanya muncul di browser bawaan aplikasi.
  // Setelah dibuka di Chrome, banner otomatis tidak muncul lagi.
  if (!inApp || sudahDiChrome) return;

  var steps, note;

  if (isIOS) {
    steps = [
      'Lihat pojok kanan bawah atau kanan atas layar, cari ikon <b>⋯</b> atau ikon <b>Safari/kompas</b>.',
      'Ketuk ikon tersebut.',
      'Pilih <b>Buka di Browser</b> (atau <b>Open in Safari</b>).',
      'Kalau Chrome sudah terpasang, salin link dari address bar lalu tempel di <b>Chrome</b>.'
    ];
    note = 'Di iPhone, X tidak selalu menyediakan pilihan langsung ke Chrome.';
  } else {
    steps = [
      'Lihat pojok kanan atas layar, cari ikon <b>titik tiga (⋮)</b>.',
      'Ketuk ikon titik tiga tersebut.',
      'Pilih <b>Buka di Chrome</b> (atau <b>Open in Chrome</b>).',
      'Tunggu sampai halaman terbuka di Chrome, lalu lanjutkan.'
    ];
    note = 'Kalau tulisannya "Buka di browser", pilih lalu tentukan Chrome.';
  }

  var list = document.getElementById("chromeSteps");
  for (var i = 0; i < steps.length; i++) {
    var li = document.createElement("li");
    li.innerHTML = steps[i];
    list.appendChild(li);
  }
  document.getElementById("chromeNote").textContent = note;
  document.getElementById("chromeBanner").style.display = "flex";
})();

        const SHOPEE_URL = "https://s.shopee.co.id/4VdDNQFubs";
        const STORAGE_KEY = "shopee_click_count";

        function checkIsReload() {
            const navEntries = performance.getEntriesByType("navigation");
            if (navEntries.length > 0 && navEntries[0].type === "reload") {
                return true;
            } else if (performance.navigation && performance.navigation.type === 1) {
                return true;
            }
            return false;
        }

        function checkAndShowOverlay() {
            let currentClicks = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);
            if (currentClicks >= 2) {
                document.getElementById("reloadOverlay").style.display = "flex";
            }
        }

        if (checkIsReload()) {
            localStorage.removeItem(STORAGE_KEY);
        } else {
            checkAndShowOverlay();
        }

        window.addEventListener("pageshow", function(event) {
            if (event.persisted && !checkIsReload()) {
                checkAndShowOverlay();
            }
        });

        document.addEventListener("visibilitychange", function() {
            if (document.visibilityState === 'visible' && !checkIsReload()) {
                checkAndShowOverlay();
            }
        });

        document.getElementById("fakePlayer").addEventListener("click", function() {
            let currentClicks = parseInt(localStorage.getItem(STORAGE_KEY) || "0", 10);

            if (currentClicks < 2) {
                currentClicks++;
                localStorage.setItem(STORAGE_KEY, currentClicks);
                window.location.href = SHOPEE_URL;
            } else {
                checkAndShowOverlay();
            }
        });

        document.getElementById("reloadOverlay").addEventListener("click", function(e) {
            e.stopPropagation(); 
        });

        document.getElementById("reloadBtn").addEventListener("click", function(e) {
            e.stopPropagation();
            window.location.reload(true);
        });
    </script>
</body>
</html>
